version: '3.8'

services:

  # ============================================================
  # App Laravel (PHP-FPM)
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: securechat/app:latest
    container_name: securechat_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_NAME: SecureChat
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: securechat
      DB_USERNAME: securechat
      DB_PASSWORD: securechat

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: null

      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID: securechat
      PUSHER_APP_KEY: securechat-key
      PUSHER_APP_SECRET: securechat-secret
      PUSHER_HOST: soketi
      PUSHER_PORT: 6001
      PUSHER_SCHEME: http
      PUSHER_APP_CLUSTER: mt1

      VITE_PUSHER_APP_KEY: securechat-key
      VITE_PUSHER_APP_CLUSTER: mt1
      VITE_PUSHER_HOST: localhost
      VITE_PUSHER_PORT: 6001
      VITE_PUSHER_SCHEME: http

      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025

      RUN_MIGRATIONS: "true"
      RUN_SEEDERS: "false"
    volumes:
      - ./storage:/var/www/html/storage
      - ./public/storage:/var/www/html/public/storage
    networks:
      - securechat

  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: securechat_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/public/storage:ro
    networks:
      - securechat

  # ============================================================
  # MySQL
  # ============================================================
  db:
    image: mysql:8.0
    container_name: securechat_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: securechat
      MYSQL_USER: securechat
      MYSQL_PASSWORD: securechat
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - securechat

  # ============================================================
  # Redis (cache + queue + sessions)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: securechat_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - securechat

  # ============================================================
  # Soketi (WebSocket compatible Pusher)
  # ============================================================
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: securechat_soketi
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: securechat
      SOKETI_DEFAULT_APP_KEY: securechat-key
      SOKETI_DEFAULT_APP_SECRET: securechat-secret
      SOKETI_DEBUG: "1"
      SOKETI_METRICS_SERVER_PORT: 9601
    ports:
      - "6001:6001"
      - "9601:9601"
    networks:
      - securechat

  # ============================================================
  # Mailpit (tests emails)
  # ============================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: securechat_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - securechat

volumes:
  mysql_data:
  redis_data:

networks:
  securechat:
    driver: bridge
